# yaml-language-server: $schema=https://goreleaser.com/static/schema.json

version: 2

project_name: forgit

before:
  hooks:
    - go mod tidy
    - go generate ./...

builds:
  - id: forgit
    main: .
    binary: forgit

    env:
      - CGO_ENABLED=0

    goos:
      - linux
      - windows
      - darwin
      - freebsd
      - openbsd

    goarch:
      - amd64
      - arm64
      - "386"

    ignore:
      - goos: darwin
        goarch: "386"

    flags:
      - -trimpath

    ldflags:
      - -s -w -X github.com/Pratyay360/forgit/cmd.version={{.Version}}

archives:
  - id: default
    ids:
      - forgit

    formats:
      - tar.gz

    name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}

    format_overrides:
      - goos: windows
        formats:
          - zip

checksum:
  name_template: checksums.txt

changelog:
  sort: asc

  filters:
    exclude:
      - "^docs:"
      - "^test:"

  groups:
    - title: Features
      regexp: "^feat"
      order: 0

    - title: Bug fixes
      regexp: "^fix"
      order: 1

    - title: Others
      order: 999

nfpms:
  - id: packages
    package_name: forgit
    description: "A simple git helper"
    homepage: "https://github.com/Pratyay360/forgit"
    maintainer: "Pratyay360 <pratyaymustafi@outlook.com>"
    license: Apache-2.0

    formats:
      - deb
      - rpm
      - apk

homebrew_casks:
  - name: forgit-cli
    homepage: "https://github.com/Pratyay360/forgit"
    description: "A simple git helper"
    license: Apache-2.0

    binaries:
      - forgit

    generate_completions_from_executable:
      executable: forgit
      args:
        - completion
      base_name: forgit
      shell_parameter_format: cobra
      shells:
        - bash
        - zsh
        - fish

    directory: Casks
    commit_msg_template: "Brew cask update for {{ .ProjectName }} version {{ .Tag }}"

    repository:
      owner: Pratyay360
      name: homebrew-tap
      branch: main


scoops:
  - name: forgit
    homepage: "https://github.com/Pratyay360/forgit"
    description: "A simple git helper"
    license: Apache-2.0
    commit_msg_template: "Scoop update for {{ .ProjectName }} version {{ .Tag }}"
    skip_upload: false

    repository:
      owner: Pratyay360
      name: scoop-bucket
      branch: main

winget:
  - name: forgit
    publisher: Pratyay360
    publisher_url: "https://github.com/Pratyay360"
    publisher_support_url: "https://github.com/Pratyay360/forgit/issues"
    package_identifier: Pratyay360.forgit
    short_description: "A simple git helper"
    description: "A unified CLI for your git forges"
    license: Apache-2.0
    homepage: "https://github.com/Pratyay360/forgit"
    commit_msg_template: "{{ .PackageIdentifier }}: {{ .Tag }}"

    repository:
      owner: Pratyay360
      name: winget-pkgs
      branch: forgit


release:
  github:
    owner: Pratyay360
    name: forgit

snapshot:
  version_template: "{{ incpatch .Version }}-next"
